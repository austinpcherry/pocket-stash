<title>Pocket Stash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: header with streak and counts, three views (Today, Browse, My stash), cards in a responsive grid.
   Each card leads with a looping animated tile, then the idea, then what applying it looks like. */
:root{
  --bg:#E8EDF2; --fg:#12202E; --muted:#4F6377; --line:#C5D0DB; --card:#F7F9FB;
  --btn:#12202E; --btn-fg:#F2F6FA; --focus:#1F5FBF; --soft:#DDE5ED;
  --ink:#14263A; --paper:#EEF2F6; --dim:#8DA2B8; --bad:#FF7A66; --good:#7BE0B4;
  --f-display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B131B; --fg:#E7EEF5; --muted:#92A5B8; --line:#233343; --card:#121C26; --soft:#18252F;
    --btn:#E7EEF5; --btn-fg:#0B131B; --focus:#7DB1FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B131B; --fg:#E7EEF5; --muted:#92A5B8; --line:#233343; --card:#121C26; --soft:#18252F;
  --btn:#E7EEF5; --btn-fg:#0B131B; --focus:#7DB1FF; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,7vw,48px);line-height:1;letter-spacing:-.02em;margin:0}
.sub{margin:8px 0 0;color:var(--muted);max-width:50ch}
.stats{display:flex;gap:10px}
.stat{min-width:92px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card)}
.stat b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font:500 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-wrap:wrap;gap:8px}
.nb{font-weight:500;font-size:14px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
.nb[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--dim))}
.chip[aria-pressed="true"]{border-color:var(--fg);font-weight:600}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.head h2,.group h3{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;margin:0;letter-spacing:-.01em}
.meta{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.group{display:flex;flex-direction:column;gap:14px}
.view{display:flex;flex-direction:column;gap:20px}

/* Card */
.card{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 14px;min-width:0}
.body{display:flex;flex-direction:column;gap:10px;padding-inline:6px;flex:1}
.title{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.08;letter-spacing:-.01em;margin:0}
.idea{margin:0}
.apply{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.apply span{display:block;font:500 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding-inline:6px}
.act{font-weight:500;font-size:13px;background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.act.stash[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.primary{font-weight:600;font-size:14px;background:var(--btn);color:var(--btn-fg);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
.primary[disabled]{opacity:.6;cursor:default}
.done{color:var(--muted);font-size:14px;margin:0}

/* Add form */
.form{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.form h3{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0}
.form label{display:flex;flex-direction:column;gap:4px;font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.form input,.form select,.form textarea{font:400 15px var(--f-body);letter-spacing:0;text-transform:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.form textarea{min-height:64px;resize:vertical}
.frow{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.frow{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}}
.empty{border:1px dashed var(--line);border-radius:16px;padding:24px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,520px);background:var(--btn);color:var(--btn-fg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* Tile: a dark loop that shows the idea. Base styles are the finished frame, so reduced motion shows it still. */
.tile{position:relative;aspect-ratio:16/10;container-type:size;overflow:hidden;border-radius:10px;
  background-color:var(--ink);background-image:radial-gradient(rgba(238,242,246,.08) 1px,transparent 1px);background-size:18px 18px;color:var(--paper)}
.m{position:absolute;inset:0}
.tag{position:absolute;left:5cqw;top:5cqh;z-index:2;font:500 3.1cqw var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--hi)}
.secs{position:absolute;right:5cqw;top:5cqh;z-index:2;font:500 3.1cqw var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.note{position:absolute;left:5cqw;right:5cqw;bottom:4.5cqh;font:500 3.1cqw var(--f-mono);letter-spacing:.06em;color:var(--dim)}
.tile svg{width:100%;height:100%;display:block}

.m-bars{inset:22% 6% 16%;display:flex;align-items:flex-end;gap:3cqw}
.m-bars i{display:block;flex:1;height:var(--h);background:rgba(238,242,246,.22);border-radius:1cqw 1cqw 0 0;transform-origin:bottom;animation:kGrow 6s var(--d) infinite}
.m-bars i.hot{background:var(--hi);box-shadow:0 0 5cqw color-mix(in srgb,var(--hi) 55%,transparent)}
.m-duel{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5cqh}
.c{position:relative;padding:3cqh 7cqw;border:.5cqw solid;border-radius:2.5cqw;font:800 8cqw/1 var(--f-display)}
.c.bad{border-color:var(--bad);color:var(--bad);opacity:.4;animation:kDim 6s infinite}
.c.bad s{position:absolute;left:-3%;right:-3%;top:50%;height:.7cqw;background:var(--bad);transform-origin:left;animation:kStrike 6s infinite}
.c.good{border-color:var(--good);color:var(--good);background:rgba(123,224,180,.14)}
.m-fp{display:flex;flex-direction:column;justify-content:flex-end;gap:2cqh;padding:16cqh 14cqw 8cqh}
.m-fp .top{position:relative;flex:1;display:block}
.m-fp .grp{position:absolute;inset:0;display:flex;flex-direction:column;gap:2cqh}
.m-fp .grp.new{justify-content:flex-end;animation:kRise 6s infinite}
.m-fp .grp.soft{opacity:0;animation:kFall 6s infinite}
.m-fp i{display:grid;place-items:center;height:11cqh;border-radius:2cqw;font:500 3.4cqw var(--f-body);font-style:normal}
.soft i{border:.5cqw dashed var(--dim);color:var(--dim)}
.new i{border:.6cqw solid var(--hi);color:var(--hi);font-weight:600}
.m-fp i.fact{background:var(--hi);color:var(--ink);font-weight:600}
.m-eis{inset:17% 10% 15%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2cqw}
.q{display:grid;place-items:center;border-radius:2cqw;background:rgba(238,242,246,.1);font:800 5cqw var(--f-display)}
.q.hot{background:var(--hi);color:var(--ink);animation:kLit 5s infinite}
.m-fence{display:flex;align-items:flex-end;justify-content:center;gap:4cqw;padding-bottom:20cqh}
.m-fence .rail{position:absolute;left:8cqw;right:8cqw;bottom:36cqh;height:1.8cqh;background:rgba(238,242,246,.28)}
.m-fence i{position:relative;width:6cqw;height:34cqh;background:rgba(238,242,246,.28);border-radius:3cqw 3cqw 0 0}
.m-fence i.gate{background:var(--hi);height:42cqh}
.m-fence b{position:absolute;left:50%;top:-15cqh;transform:translateX(-50%);font:800 11cqw/1 var(--f-display);color:var(--hi);animation:kBob 2.2s ease-in-out infinite}
.m-park{padding:22cqh 7cqw 0;display:flex;flex-direction:column;gap:5cqh}
.m-park span{font:500 3.1cqw var(--f-mono);letter-spacing:.06em;color:var(--dim)}
.trk{height:9cqh;border-radius:2cqw;background:rgba(238,242,246,.14);overflow:hidden;margin-top:1.4cqh}
.trk.short{width:30%}
.trk i{display:block;height:100%;background:var(--hi);transform-origin:left;animation:kFill 6s infinite}
.trk.short i{animation-duration:3s}
.m-sunk{display:flex;align-items:center;justify-content:center;gap:9cqw;padding-top:8cqh}
.m-sunk .col{display:flex;flex-direction:column;align-items:center;gap:3cqh}
.m-sunk span{font:500 3.1cqw var(--f-mono);letter-spacing:.06em;color:var(--dim)}
.coins{display:flex;flex-direction:column-reverse;gap:1cqh;opacity:.25;animation:kSpent 6s infinite}
.coins i{width:15cqw;height:5cqh;border-radius:50%;background:var(--hi)}
.fresh{width:21cqw;height:8cqh;border-radius:50%;background:var(--hi);box-shadow:0 0 5cqw color-mix(in srgb,var(--hi) 55%,transparent);animation:kPulse 2s ease-in-out infinite}
.m-sunk b{font:800 9cqw var(--f-display);color:var(--dim)}
.m-flip{display:grid;place-items:center;perspective:120cqw}
.flipc{position:relative;width:62cqw;height:34cqh;transform-style:preserve-3d;transform:rotateY(180deg);animation:kFlip 6s ease-in-out infinite}
.flipc span{position:absolute;inset:0;display:grid;place-items:center;border-radius:3cqw;border:.6cqw solid var(--paper);font:800 7cqw/1 var(--f-display);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipc .b{border-color:var(--hi);color:var(--hi);transform:rotateY(180deg);background:rgba(20,38,58,.9)}
.n2{animation:kShow2 7s infinite}
.n3{animation:kShow3 7s infinite}
.m-pulse i{position:absolute;left:50%;top:52%;width:46cqh;height:46cqh;margin:-23cqh 0 0 -23cqh;border:.7cqw solid var(--hi);border-radius:50%;transform:scale(.6);opacity:.5;animation:kRipple 2.4s var(--d,0s) infinite}

@keyframes kGrow{0%{transform:scaleY(.04)}18%,86%{transform:none}100%{transform:scaleY(.04)}}
@keyframes kStrike{0%,28%{transform:scaleX(0)}42%,88%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes kDim{0%,28%{opacity:1}42%,88%{opacity:.4}100%{opacity:1}}
@keyframes kFall{0%,22%{opacity:1;transform:none}40%,100%{opacity:0;transform:translateX(34cqw) rotate(8deg)}}
@keyframes kRise{0%,45%{opacity:0;transform:translateY(-6cqh)}60%,100%{opacity:1;transform:none}}
@keyframes kLit{0%,12%{background:rgba(238,242,246,.1);color:var(--paper)}30%,100%{background:var(--hi);color:var(--ink)}}
@keyframes kBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-2.2cqh)}}
@keyframes kFill{0%{transform:scaleX(.06)}70%,100%{transform:none}}
@keyframes kSpent{0%,20%{opacity:1}40%,100%{opacity:.25}}
@keyframes kPulse{50%{transform:scale(1.14)}}
@keyframes kFlip{0%,30%{transform:rotateY(0)}45%,80%{transform:rotateY(180deg)}95%,100%{transform:rotateY(360deg)}}
@keyframes kRing{0%{stroke-dashoffset:176}65%,100%{stroke-dashoffset:0}}
@keyframes kPop{0%,62%{opacity:0;transform:scale(.4)}72%,100%{opacity:1;transform:none}}
@keyframes kShow2{0%,22%{opacity:0}38%,100%{opacity:1}}
@keyframes kShow3{0%,52%{opacity:0}68%,100%{opacity:1}}
@keyframes kRipple{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1);opacity:0}}
.ring{stroke-dasharray:176;stroke-dashoffset:0;transform:rotate(-90deg);transform-box:fill-box;transform-origin:center;animation:kRing 5s infinite}
.tick{transform-box:fill-box;transform-origin:center;animation:kPop 5s infinite}

.exl{margin:0;font-size:14px;color:var(--muted)}
.exl b{font:500 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;margin-right:6px;color:var(--fg)}
.act.watch{border-color:var(--fg);font-weight:600}
.act.watch::before{content:"";display:inline-block;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-right:8px}

/* Example player */
.pl{position:fixed;inset:0;z-index:20;background:rgba(7,12,18,.96);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) 16px max(12px,env(safe-area-inset-bottom,0px))}
.pl-box{width:100%;max-width:440px;margin-block:auto;display:flex;flex-direction:column;gap:10px;color:#E7EEF5}
.pl-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pl-top h2{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.1;margin:0}
.pl .act{border-color:#33475A;color:#E7EEF5}
.pl .primary{background:#E7EEF5;color:#0B131B}
.pl-stage{position:relative;aspect-ratio:9/16;container-type:size;overflow:hidden;border-radius:18px;width:min(100%,calc((100vh - 240px)*9/16));width:min(100%,calc((100dvh - 240px)*9/16));margin-inline:auto;
  background-color:var(--ink);background-image:radial-gradient(rgba(238,242,246,.08) 1px,transparent 1px);background-size:22px 22px;color:var(--paper);--hi:#FFB83D;--ink2:#1E3753}
.pl-hud{position:absolute;left:7cqw;right:7cqw;top:5.5cqw;display:flex;justify-content:space-between;gap:3cqw;z-index:2;font:500 3cqw var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.pl-hud span+span{color:var(--hi)}
.pl-scene{position:absolute;inset:15cqw 7cqw 38cqw 7cqw;display:flex;flex-direction:column;justify-content:center}
.pl-cap{position:absolute;left:7cqw;right:7cqw;bottom:6cqw;margin:0;min-height:26cqw;display:flex;align-items:flex-end;font:500 4.3cqw/1.32 var(--f-body);color:var(--paper)}
.pl-cap.in{animation:kIn .5s both}
.pl-cap.off{visibility:hidden}
.pl-cover,.pl-end{position:absolute;inset:0;z-index:3;background:rgba(20,38,58,.95);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:3.4cqw;padding:7cqw 7cqw 9cqw}
.pl-cover p,.pl-end p{margin:0}
.pl-cover .k,.pl-end .k{font:500 3cqw var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--hi)}
.pl-cover .n{font:800 15cqw/.95 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
.pl-cover .w{font-size:5cqw;line-height:1.25;color:var(--paper)}
.pl-cover .primary,.pl-end .primary{font-size:4.4cqw;padding:3cqw 6cqw;border-radius:2.6cqw}
.pl-end .act{font-size:4cqw;padding:2.6cqw 5cqw;border-radius:2cqw}
.pl-end .row{display:flex;flex-wrap:wrap;gap:2.4cqw}
.pl-ctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;width:min(100%,calc((100vh - 240px)*9/16));width:min(100%,calc((100dvh - 240px)*9/16));min-width:280px;margin-inline:auto}
.pl-segs{display:flex;gap:6px}
.pl-seg{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;background:none;border:0;padding:4px 0;cursor:pointer;color:#92A5B8;font:500 9px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pl-seg i{display:block;height:4px;border-radius:2px;background:#33475A;overflow:hidden;position:relative}
.pl-seg i::after{content:"";position:absolute;inset:0;background:#E7EEF5;transform:scaleX(var(--p,0));transform-origin:left}
.pl-seg.cur{color:#E7EEF5}
.pl-opt{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;font-size:13px;width:min(100%,calc((100vh - 240px)*9/16));width:min(100%,calc((100dvh - 240px)*9/16));min-width:280px;margin-inline:auto}
.pl-opt label{display:flex;align-items:center;gap:6px}
.pl-opt select{background:#121C26;color:#E7EEF5;border:1px solid #33475A;border-radius:8px;padding:6px 8px;max-width:180px}
.pl-status{margin:0 auto;font-size:12px;line-height:1.35;color:#92A5B8;text-align:center;min-height:16px;max-width:320px}
.pl-status.warn{color:#FFB4A8}
.pl-stage.paused *{animation-play-state:paused!important}

/* Scene templates, sized in container units so they scale with the stage */
.lab{font:500 3cqw var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 1cqw}
.lst,.chat,.bars,.spl,.quad,.bigw,.remw{display:flex;flex-direction:column;gap:2.6cqw}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
.quad .lab{grid-column:1/-1}
.it{position:relative;display:flex;align-items:center;gap:3cqw;padding:3.2cqw 4cqw;border-radius:2.4cqw;background:var(--ink2);font-size:4.6cqw;line-height:1.2;animation:kIn .5s var(--d) both}
.it .tx{flex:1;min-width:0}
.it .nm{flex:none;display:grid;place-items:center;width:7cqw;height:7cqw;border-radius:50%;background:var(--hi);color:var(--ink);font:500 3.4cqw var(--f-mono)}
.it.s-hot{background:var(--hi);color:var(--ink);font-weight:600;animation:kIn .5s var(--d) both,kHot .5s var(--a) both}
.it.s-dim{background:rgba(30,55,83,.35);color:var(--dim);animation:kIn .5s var(--d) both,kDimIt .5s var(--a) both}
.it.s-bad{background:rgba(255,122,102,.2);color:var(--bad);animation:kIn .5s var(--d) both,kBad .5s var(--a) both}
.it .ck{flex:none;position:relative;width:6cqw;height:6cqw;border-radius:50%;background:var(--good);animation:kPopCk .4s var(--a) both}
.it .ck::after{content:"";position:absolute;left:1.9cqw;top:.9cqw;width:1.5cqw;height:2.8cqw;border:solid var(--ink);border-width:0 .7cqw .7cqw 0;transform:rotate(45deg)}
.it .old{position:relative;display:block;width:fit-content;color:var(--dim)}
.it .new{display:block;margin-top:1cqw;color:var(--good);font-weight:600;animation:kIn .5s calc(var(--a) + .3s) both}
.ln{position:absolute;left:-1cqw;right:-1cqw;top:55%;height:.7cqw;background:var(--bad);transform-origin:left;animation:kStrikeL .4s var(--a) both}
.bub{max-width:82%;padding:3cqw 4cqw;border-radius:4cqw;font-size:4.4cqw;line-height:1.25;animation:kIn .5s var(--d) both}
.bub.me{align-self:flex-end;background:var(--hi);color:var(--ink);border-bottom-right-radius:1cqw}
.bub.them{align-self:flex-start;background:var(--ink2);border-bottom-left-radius:1cqw}
.bub.sys{align-self:center;max-width:100%;padding:0;font:500 3.2cqw var(--f-mono);color:var(--dim)}
.bub.think{align-self:center;max-width:90%;border:.6cqw dashed;font-style:italic;text-align:center}
.bub.think.bad{border-color:var(--bad);color:var(--bad)}
.bub.think.good{border-color:var(--good);color:var(--good)}

  }
  function gall(){
    var n=[[28,52],[70,30],[70,74],[116,16],[116,42],[116,66],[116,92]];

    var cls=['','n2','n2','n3','n3','n3','n3'];

    e.forEach(function(x){s+='<line class="'+x[2]+'" x1="'+n[x[0]][0]+'" y1="'+n[x[0]][1]+'" x2="'+n[x[1]][0]+'" y2="'+n[x[1]][1]+'" stroke="var(--dim)" stroke-width="1.6"/>'});

    return '<div class="m">'+s+'</svg></div><span class="note">Start simple. Let it grow.</span>';
  }
  function ring(){
    return '<div class="m"><svg viewBox="0 0 160 100" aria-hidden="true"><circle cx="80" cy="50" r="28" fill="none" stroke="rgba(238,242,246,.16)" stroke-width="6"/><circle class="ring" cx="80" cy="50" r="28" fill="none" stroke="var(--hi)" stroke-width="6" stroke-linecap="round"/><text x="80" y="56" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="16" font-weight="500" fill="var(--paper)">2:00</text><path class="tick" d="M122 50 l8 8 l14 -16" fill="none" stroke="var(--hi)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="note">Under two minutes? Do it now.</span>';

  function pad(n){return String(n).padStart(2,'0')}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function todayStr(){return ymd(new Date())}
  function yestStr(){var d=new Date();d.setDate(d.getDate()-1);return ymd(d)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function el(id){return document.getElementById(id)}

  function pulse(){return '<div class="m m-pulse"><i></i><i style="--d:.8s"></i><i style="--d:1.6s"></i></div>'}
  function allIdeas(){return IDEAS.concat(state.custom)}
  function byId(id){return allIdeas().filter(function(i){return i.id===id})[0]}
  function isStashed(id){return state.stashed.indexOf(id)>-1}

  function cardHTML(i){
    var custom=!!i.custom;
    var motif=custom?pulse():i.motif();
    var hi=TOPICS[i.topic]||'#7CC4FF';
    return '<article class="card" data-id="'+esc(i.id)+'" style="--hi:'+hi+'">'+
      '<div class="tile" role="img" aria-label="Animated clip: '+esc(i.title)+'">'+motif+'<span class="tag">'+esc(i.topic)+'</span><span class="secs">'+(i.secs||15)+' sec</span></div>'+
      '<div class="body"><h3 class="title">'+esc(i.title)+'</h3><p class="idea">'+esc(i.idea)+'</p>'+
      '<div class="apply"><span>Applying it</span>'+esc(i.apply)+'</div>'+
      (i.src?'<p class="exl"><b>Source</b>'+esc(i.src)+'</p>':'')+(i.ex?'<p class="exl"><b>Example</b>'+esc(i.ex.who)+'</p>':'')+'</div>'+
      '<div class="acts">'+(i.ex?'<button class="act watch" type="button" data-act="watch">Watch example</button>':'')+
      '<button class="act stash" type="button" data-act="stash" aria-pressed="'+isStashed(i.id)+'">'+(isStashed(i.id)?'Stashed':'Stash')+'</button>'+
      '<button class="act" type="button" data-act="copy">Copy to share</button>'+
      (custom?'<button class="act" type="button" data-act="remove">Remove</button>':'')+'</div></article>';
  }
  function fill(node,list){node.innerHTML=list.map(cardHTML).join('')}

  /* Views */
  var view='today',filter='All';
  function dayPicks(){
    var n=IDEAS.length,d=new Date();
    var num=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
    var s=(num*3)%n;
    return [0,1,2].map(function(k){return IDEAS[(s+k)%n]});
  }
  function renderToday(){
    el('todayMeta').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
    fill(el('todayGrid'),dayPicks());
    var done=state.done===todayStr();
    el('todayAction').innerHTML=done
      ? '<p class="done">Done for today. Come back tomorrow for three more.</p>'
      : '<button class="primary" type="button" id="finish">Finish today\'s set</button>';
  }
  function renderBrowse(){
    var tops=['All'].concat(Object.keys(TOPICS));
    el('chips').innerHTML=tops.map(function(t){
      return '<button class="chip" type="button" data-topic="'+t+'" aria-pressed="'+(t===filter)+'"'+(TOPICS[t]?' style="--c:'+TOPICS[t]+'"':'')+'>'+(TOPICS[t]?'<i></i>':'')+t+'</button>';
    }).join('');
    var list=IDEAS.filter(function(i){return filter==='All'||i.topic===filter});
    el('browseMeta').textContent=list.length+(list.length===1?' idea':' ideas');
    fill(el('browseGrid'),list);
  }
  function renderStash(){
    var list=allIdeas().filter(function(i){return isStashed(i.id)});
    el('stashMeta').textContent=list.length+(list.length===1?' idea':' ideas');
    var box=el('stashGroups');
    if(!list.length){
      box.innerHTML='<div class="empty">Nothing here yet. Tap Stash on any idea and it lands here, sorted by topic. You can also add your own below.</div>';
      return;
    }
    box.innerHTML='';
    Object.keys(TOPICS).forEach(function(t){
      var g=list.filter(function(i){return i.topic===t});
      if(!g.length)return;
      var sec=document.createElement('div');
      sec.className='group';
      sec.innerHTML='<h3>'+t+' <span class="meta">'+g.length+'</span></h3><div class="grid"></div>';
      fill(sec.querySelector('.grid'),g);
      box.appendChild(sec);
    });
  }
  function counts(){
    el('statStash').textContent=state.stashed.filter(function(id){return !!byId(id)}).length;
    var s=state.streak,t=todayStr(),y=yestStr();
    el('statStreak').textContent=(s.last===t||s.last===y)?s.count:0;
  }
  function show(v){
    view=v;
    ['today','browse','stash'].forEach(function(n){el('v-'+n).hidden=(n!==v)});
    document.querySelectorAll('.nb').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.view===v?'true':'false')});
    if(v==='today')renderToday();
    if(v==='browse')renderBrowse();
    if(v==='stash')renderStash();
    counts();
  }

  var tt;
  function toast(msg){
    var t=el('toast');t.textContent=msg;t.hidden=false;
    clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2600);
  }
  function copyText(txt){
    function fallback(){toast('Copy not available here. Your line: '+txt.replace(/\n/g,' - '))}
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){toast('Copied. Send it to someone.')},fallback);
      }else fallback();
    }catch(e){fallback()}
  }

  /* Events */
  document.addEventListener('click',function(e){
    var nb=e.target.closest('.nb');
    if(nb){show(nb.dataset.view);return}
    var chip=e.target.closest('.chip');
    if(chip){filter=chip.dataset.topic;renderBrowse();return}
    if(e.target.id==='finish'){
      var t=todayStr();
      if(state.done!==t){
        state.streak.count=(state.streak.last===yestStr())?state.streak.count+1:1;
        state.streak.last=t;state.done=t;save();
      }
      renderToday();counts();return;
    }
    var b=e.target.closest('[data-act]');
    if(!b)return;
    var card=b.closest('.card'),id=card.dataset.id,idea=byId(id);
    if(!idea)return;
    if(b.dataset.act==='stash'){
      var at=state.stashed.indexOf(id);
      if(at>-1)state.stashed.splice(at,1);else state.stashed.push(id);
      save();
      var on=isStashed(id);
      document.querySelectorAll('.card[data-id="'+id+'"] .stash').forEach(function(x){
        x.setAttribute('aria-pressed',on?'true':'false');x.textContent=on?'Stashed':'Stash';
      });
      if(view==='stash')renderStash();
      counts();
    }else if(b.dataset.act==='watch'){
      openPlayer(id,b);
    }else if(b.dataset.act==='copy'){
      copyText(idea.title+'\n'+(idea.remind||idea.apply)+(idea.src?'\n('+idea.src+')':''));
    }else if(b.dataset.act==='remove'){
      state.custom=state.custom.filter(function(c){return c.id!==id});
      state.stashed=state.stashed.filter(function(s){return s!==id});
      save();renderStash();counts();
    }
  });

  el('fTopic').innerHTML=Object.keys(TOPICS).map(function(t){return '<option>'+t+'</option>'}).join('');
  el('addForm').addEventListener('submit',function(e){
    e.preventDefault();
    var title=el('fTitle').value.trim(),idea=el('fIdea').value.trim(),apply=el('fApply').value.trim();
    if(!title||!idea){toast('Add a name and the idea first.');return}
    var item={id:'c'+Date.now(),custom:true,topic:el('fTopic').value,secs:15,title:title,idea:idea,apply:apply||'Pick one small action and do it today.',remind:apply||title};
    state.custom.push(item);state.stashed.push(item.id);save();
    el('addForm').reset();renderStash();counts();toast('Added to your stash.');
  });

  /* ---------- Example player: scene templates, narration, sound ---------- */
  function ts(n,a,b){var o=[],i;if(n<=0)return o;if(n===1)return [a];for(i=0;i<n;i++)o.push(a+(b-a)*i/(n-1));return o}
  function q2(x){return x.toFixed(2)}
  var SOUNDFOR={hot:'chime',dim:'tick',bad:'strike',done:'chime'};
  var R={};

  R.list=function(s,sp){
    var it=s.items,n=it.length;
    var a1=Math.max(.4+.35*(n-1),Math.min(sp*.5,.4+.8*(n-1)));
    var T=ts(n,.4,a1),st=[];
    it.forEach(function(x,i){if(x.s||x.y)st.push(i)});
    var b0=a1+.8,B=ts(st.length,b0,Math.max(b0+.5*(st.length-1),sp-.8));
    var h='<div class="lst">'+(s.cap?'<p class="lab">'+esc(s.cap)+'</p>':'');
    it.forEach(function(x,i){
      var k=st.indexOf(i),a=k>-1?B[k]:T[i];
      var sx='pop:'+q2(T[i]);
      if(x.y)sx+=' strike:'+q2(a)+' chime:'+q2(a+.35);
      else if(x.s)sx+=' '+SOUNDFOR[x.s]+':'+q2(a);
      var tx=x.y?'<span class="old">'+esc(x.x)+'<i class="ln"></i></span><span class="new">'+esc(x.y)+'</span>':esc(x.x);
      h+='<div class="it'+(x.s?' s-'+x.s:'')+'" style="--d:'+q2(T[i])+'s;--a:'+q2(a)+'s" data-sfx="'+sx+'">'+
        (s.num?'<span class="nm">'+(i+1)+'</span>':'')+'<span class="tx">'+tx+'</span>'+(x.s==='done'?'<i class="ck"></i>':'')+'</div>';
    });
    return h+'</div>';
  };
  R.chat=function(s,sp){
    var n=s.msgs.length,T=ts(n,.5,Math.max(.5+.8*(n-1),sp-1.8));
    var h='<div class="chat">'+(s.cap?'<p class="lab">'+esc(s.cap)+'</p>':'');
    s.msgs.forEach(function(m,i){
      var sx=(m.f==='me'?'tick:':'pop:')+q2(T[i]),a=Math.max(T[i]+.8,sp-1);
      if(m.f==='think'&&m.s==='good')sx+=' chime:'+q2(T[i]+.4);
      if(m.s==='draft')sx+=' strike:'+q2(a);
      h+='<div class="bub '+m.f+(m.s?' '+m.s:'')+'" style="--d:'+q2(T[i])+'s;--a:'+q2(a)+'s" data-sfx="'+sx+'">'+esc(m.x)+(m.s==='draft'?'<i class="ln"></i>':'')+'</div>';
    });
    return h+'</div>';
  };
  R.quad=function(s,sp){
    var n=s.items.length,T=ts(n,.8,Math.max(.8+.8*(n-1),sp-1.6)),lit=0;
    var names=[['Do now','urgent, important'],['Plan','important, not urgent'],['Delegate','urgent, not important'],['Drop','neither']];
    s.items.forEach(function(x,i){if(x.q===s.hot)lit=T[i]+.4});
    return '<div class="quad">'+names.map(function(nm,q){
      var chips=s.items.map(function(x,i){return x.q===q?'<div class="qc" style="--d:'+q2(T[i])+'s" data-sfx="pop:'+q2(T[i])+'">'+esc(x.x)+'</div>':''}).join('');
      var hot=q===s.hot;
      return '<div class="qd'+(hot?' hot':'')+'" style="--a:'+q2(lit)+'s"'+(hot?' data-sfx="chime:'+q2(lit)+'"':'')+'><h4>'+nm[0]+'</h4><small>'+nm[1]+'</small>'+chips+'</div>';
    }).join('')+'</div>';
  };
  R.bars=function(s,sp){
    var n=s.rows.length,T=ts(n,.4,Math.max(.4+.45*(n-1),sp*.5));
    return '<div class="bars">'+(s.cap?'<p class="lab">'+esc(s.cap)+'</p>':'')+s.rows.map(function(r,i){
      var w=Math.min(100,r.v/(s.max||100)*100);
      return '<div class="br'+(r.hot?' hot':'')+'" data-sfx="pop:'+q2(T[i])+(r.hot?' chime:'+q2(T[i]+.8):'')+'"><div class="bl"><span>'+esc(r.l)+'</span><b style="--d:'+q2(T[i]+.5)+'s">'+esc(r.t)+'</b></div><div class="tr"><div class="fl" style="--w:'+w.toFixed(1)+'%;--d:'+q2(T[i])+'s"></div></div></div>';
    }).join('')+'</div>';
  };
  R.split=function(s,sp){
    var cur=.4;
    var B=s.blocks.map(function(b){
      var o={b:b,d:cur,t:[]};cur+=.5;
      (b.items||[]).forEach(function(){o.t.push(cur);cur+=.6});
      o.end=cur;cur+=.5;return o;
    });
    var A=Math.max(cur-.2,sp-1.3);
    return '<div class="spl">'+B.map(function(o){
      var b=o.b,sx='pop:'+q2(o.d);
      if(b.lose)sx+=' strike:'+q2(A);
      if(b.tone==='good')sx+=' chime:'+q2(o.end);
      return '<div class="blk '+(b.tone||'')+'" style="--d:'+q2(o.d)+'s;--a:'+q2(A)+'s" data-sfx="'+sx+'"><h4>'+esc(b.h)+(b.lose?'<i class="ln"></i>':'')+'</h4>'+
        (b.items||[]).map(function(x,k){return '<p style="--d:'+q2(o.t[k])+'s" data-sfx="tick:'+q2(o.t[k])+'">'+esc(x)+'</p>'}).join('')+'</div>';
    }).join('')+'</div>';
  };
  function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
  R.big=function(s){
    var c=s.count,d=.4,dur=1.6,sx='pop:.3 chime:1',k,txt=s.big,attr='';
    if(c){
      sx='';for(k=0;k<14;k++)sx+=(k?' ':'')+'tick:'+q2(d+k*(dur/14));
      sx+=' chime:'+q2(d+dur+.1);
      attr=' data-count="'+[c.from||0,c.to,c.pre||'',c.suf||'',d,dur].join('|')+'"';
      txt=(c.pre||'')+fmt(c.to)+(c.suf||'');
    }
    return '<div class="bigw" data-sfx="'+sx+'"><div class="bg" style="--d:.3s"'+attr+'>'+esc(txt)+'</div><p class="bc">'+esc(s.cap||'')+'</p>'+(s.sub?'<p class="bs">'+esc(s.sub)+'</p>':'')+'</div>';
  };
/*__ACT__*/
  R.rem=function(s){
    var parts=(s.text.match(/[^.!?]+[.!?]?/g)||[s.text]).map(function(x){return x.trim()}).filter(Boolean);
    var last=parts.length-1;
    return '<div class="remw">'+parts.map(function(p,i){
      var d=.5+i*1.1;
      return '<p class="rl'+(i===last?' hl':'')+'" style="--d:'+q2(d)+'s" data-sfx="'+(i===last?'done':'pop')+':'+q2(d)+'">'+esc(p)+'</p>';
    }).join('')+'<div class="rn"><i></i><span>'+esc(s.name)+'</span></div></div>';
  };

  var PL={open:false,idea:null,list:[],scenes:[],idx:0,st:0,min:4,playing:false,started:false,loading:false,evs:[],ptr:0,counts:[],last:0,sound:true,vk:'bella',ctx:null,master:null,vgain:null,src:null,buf:null,sc:null,mode:null,speechDone:true,token:0,sceneTok:0,opener:null};
  try{var pr=JSON.parse(localStorage.getItem('pocket-stash-audio')||'{}');if(pr.sound===false)PL.sound=false;if(pr.vk==='bella'||pr.vk==='michael')PL.vk=pr.vk}catch(e){}
  function savePrefs(){try{localStorage.setItem('pocket-stash-audio',JSON.stringify({sound:PL.sound,vk:PL.vk}))}catch(e){}}

  /* Sound effects are synthesized with the Web Audio API, so no audio files are needed. */
  function initAudio(){
    if(PL.ctx)return;
    try{
      var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      PL.ctx=new AC();PL.master=PL.ctx.createGain();PL.master.gain.value=.5;PL.master.connect(PL.ctx.destination);
      PL.vgain=PL.ctx.createGain();PL.vgain.gain.value=1;PL.vgain.connect(PL.ctx.destination);
    }catch(e){PL.ctx=null}
  }
  function env(g,t,a,d,peak){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
  function tone(freq,type,a,d,peak,delay,slide){
    var c=PL.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+a+d);
    env(g,t,a,d,peak);o.connect(g);g.connect(PL.master);o.start(t);o.stop(t+a+d+.05);
  }
  function noise(d,f0,f1,peak){
    var c=PL.ctx,t=c.currentTime,len=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,len,c.sampleRate),data=buf.getChannelData(0),i;
    for(i=0;i<len;i++)data[i]=Math.random()*2-1;
    var s=c.createBufferSource();s.buffer=buf;
    var f=c.createBiquadFilter();f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);
    var g=c.createGain();env(g,t,.02,d-.02,peak);
    s.connect(f);f.connect(g);g.connect(PL.master);s.start(t);
  }
  var SFX={
    pop:function(){tone(520,'triangle',.008,.14,.16,0,760)},
    tick:function(){tone(1500,'square',.002,.03,.04)},
    chime:function(){tone(784,'sine',.01,.5,.15);tone(1175,'sine',.01,.6,.09,.07)},
    strike:function(){noise(.22,2600,500,.13)},
    whoosh:function(){noise(.4,300,2400,.06)},
    done:function(){tone(523,'sine',.01,.3,.13);tone(659,'sine',.01,.3,.11,.09);tone(784,'sine',.01,.6,.13,.18)}
  };
  function sfx(n){
    if(!PL.sound||!PL.ctx||!SFX[n])return;
    try{if(PL.ctx.state==='suspended')PL.ctx.resume();SFX[n]()}catch(e){}
  }

  /* Narration: recorded voices published next to the page, with the browser's own voice as a fallback. */
  var VOICES=[{k:'bella',n:'Bella (female)'},{k:'michael',n:'Michael (male)'}];
  var NARR={};
  function status(msg,warn){var s=el('plStatus');s.textContent=msg;s.className='pl-status'+(warn?' warn':'')}
  function loadNarr(key){
    var id=PL.vk+'/'+key;
    if(NARR[id])return NARR[id];
    NARR[id]=new Promise(function(res){
      if(!PL.ctx||!window.fetch){res(null);return}
      fetch('audio/'+id+'.mp3').then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.arrayBuffer()}).then(function(ab){
        var done=false;
        function ok(b){if(!done){done=true;res(b)}}
        function bad(){if(!done){done=true;res(null)}}
        var p=PL.ctx.decodeAudioData(ab,ok,bad);
        if(p&&p.catch)p.catch(bad);
      }).catch(function(){res(null)});
    }).then(function(b){if(!b)delete NARR[id];return b});
    return NARR[id];
  }
  function stopNarr(){
    if(PL.src){PL.src.onended=null;try{PL.src.stop()}catch(e){}PL.src=null}
    PL.token++;
    try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
  }
  function playBuf(buf){
    try{
      var s=PL.ctx.createBufferSource();s.buffer=buf;s.connect(PL.vgain);
      s.onended=function(){if(PL.src===s)PL.speechDone=true};
      PL.src=s;PL.speechDone=false;s.start();return true;
    }catch(e){return false}
  }
  function speakBrowser(txt){
    PL.speechDone=false;
    try{
      var vs=speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang)});
      if(!vs.length){PL.speechDone=true;return false}
      var v=vs.filter(function(x){return /en-US/i.test(x.lang)})[0]||vs[0];
      speechSynthesis.cancel();
      var tok=++PL.token,u=new SpeechSynthesisUtterance(txt);
      u.voice=v;u.lang=v.lang;u.rate=.98;
      u.onend=u.onerror=function(){if(tok===PL.token)PL.speechDone=true};
      speechSynthesis.speak(u);return true;
    }catch(e){PL.speechDone=true;return false}
  }
  function playNarr(buf,sc){
    if(buf&&playBuf(buf)){PL.mode='recorded';status('Narration: recorded voice. Effects: on.')}
    else if('speechSynthesis' in window&&speakBrowser(sc.nar)){PL.mode='browser';status("Narration: your browser's own voice (recording did not load).")}
    else{PL.mode='none';PL.speechDone=true;status('No narration could play here, so captions are on. Try Test sound.',true)}
  }

  function estimate(nar){return Math.max(4.2,nar.trim().split(/\s+/).length/2.6+.8)}
  function buildSegs(){
    el('plSegs').innerHTML=PL.scenes.map(function(sc,k){return '<button class="pl-seg" type="button" data-k="'+k+'" aria-label="Go to '+esc(sc.l)+'">'+esc(sc.l)+'<i></i></button>'}).join('');
  }
  function paintSegs(){
    var segs=el('plSegs').children,i,p;
    for(i=0;i<segs.length;i++){
      p=i<PL.idx?1:(i>PL.idx?0:Math.min(1,PL.st/PL.min));
      segs[i].style.setProperty('--p',p);
      segs[i].classList.toggle('cur',i===PL.idx);
    }
  }
  function renderScene(i,buf){
    var sc=PL.scenes[i],sp=buf?buf.duration+.6:estimate(sc.nar),host=el('plScene'),cap=el('plCap');
    PL.buf=buf;PL.sc=sc;
    PL.eng=null;host.innerHTML=(R[sc.t]||R.list)(sc,sp);
    if(sc.t==='act'&&PL.eng){PL.eng.bind(host);PL.eng.render(0)}
    cap.textContent=sc.nar;cap.classList.toggle('off',sc.t==='rem');
    cap.classList.remove('in');void cap.offsetWidth;cap.classList.add('in');
    el('plHudStep').textContent=sc.l;
    PL.st=0;PL.ptr=0;
    var evs=[{t:0,n:'whoosh'}],last=0;
    host.querySelectorAll('[data-sfx]').forEach(function(n){
      n.getAttribute('data-sfx').split(' ').forEach(function(p){
        var q=p.split(':'),t=parseFloat(q[1]);
        if(q[0]&&!isNaN(t)){evs.push({t:t,n:q[0]});if(t>last)last=t}
      });
    });
    evs.sort(function(a,b){return a.t-b.t});
    PL.evs=evs;
    PL.min=Math.max(3.5,sp,last+1.4);
    PL.counts=[];
    host.querySelectorAll('[data-count]').forEach(function(n){
      var c=n.getAttribute('data-count').split('|');
      PL.counts.push({n:n,from:+c[0],to:+c[1],pre:c[2],suf:c[3],d:+c[4],dur:+c[5]});
    });
    PL.loading=false;
    if(PL.playing&&PL.sound)playNarr(buf,sc);else PL.speechDone=true;
    paintSegs();
  }
  function startScene(i){
    PL.idx=i;PL.loading=true;stopNarr();
    var tok=++PL.sceneTok;
    var timeout=new Promise(function(r){setTimeout(function(){r(null)},2500)});
    Promise.race([loadNarr(PL.idea.id+'-'+i),timeout]).then(function(buf){
      if(tok===PL.sceneTok)renderScene(i,buf);
    });
  }
  function prefetch(){PL.scenes.forEach(function(s,k){loadNarr(PL.idea.id+'-'+k)})}
  function setPlaying(p){
    PL.playing=p;el('plStage').classList.toggle('paused',!p);
    if(p)PL.last=performance.now();
    if(PL.ctx){try{if(p)PL.ctx.resume();else PL.ctx.suspend()}catch(e){}}
    el('plPlay').textContent=p?'Pause':(el('plEnd').hidden?'Play':'Replay');
  }
  function checkCtx(){
    if(!PL.ctx){status('This browser has no audio engine, so captions are on.',true);return}
    try{
      PL.ctx.resume().then(function(){setTimeout(function(){
        if(PL.open&&PL.playing&&PL.ctx.state!=='running')status('Audio is blocked in this view. Press Test sound and check that this tab is not muted.',true);
      },700)});
    }catch(e){}
  }
  function begin(){
    initAudio();
    PL.started=true;el('plCover').hidden=true;el('plEnd').hidden=true;
    setPlaying(true);
    prefetch();
    startScene(0);
    checkCtx();
  }
  function finish(){
    stopNarr();setPlaying(false);
    el('plEndLine').textContent=PL.idea.remind;
    var nxt=nextIdea();
    el('plNext').hidden=!nxt;
    if(nxt)el('plNext').textContent='Next: '+nxt.title;
    el('plEnd').hidden=false;
    el('plPlay').textContent='Replay';
  }
  function nextIdea(){
    var at=PL.list.indexOf(PL.idea.id);
    if(at<0||PL.list.length<2)return null;
    return byId(PL.list[(at+1)%PL.list.length]);
  }
  function loadIdea(idea){
    stopNarr();PL.sceneTok++;
    PL.idea=idea;
    PL.scenes=idea.ex.scenes.concat([{l:'Recall',t:'rem',nar:idea.remind,text:idea.remind,name:idea.title}]);
    PL.started=false;PL.idx=0;PL.st=0;PL.loading=false;PL.mode=null;
    var stage=el('plStage');
    stage.style.setProperty('--hi',TOPICS[idea.topic]||'#7CC4FF');
    stage.classList.remove('paused');
    el('plTitle').textContent=idea.title;
    el('plHudName').textContent=idea.title;el('plHudStep').textContent=idea.topic;
    el('plCoverName').textContent=idea.title;el('plCoverWho').textContent=idea.ex.who;
    el('plScene').innerHTML='';el('plCap').textContent='';
    el('plCover').hidden=false;el('plEnd').hidden=true;
    buildSegs();paintSegs();
    PL.playing=false;el('plPlay').textContent='Play';
    PL.speechDone=true;
    status('Press Play. Narration and sound start when you click.');
  }
  function openPlayer(id,opener){
    var idea=byId(id);if(!idea||!idea.ex)return;
    var seen={};
    PL.list=[].slice.call(document.querySelectorAll('#v-'+view+' .card')).map(function(c){return c.dataset.id}).filter(function(k){var o=byId(k);if(seen[k]||!o||!o.ex)return false;seen[k]=1;return true});
    PL.open=true;PL.opener=opener||null;
    el('plSound').checked=PL.sound;
    el('plVoice').value=PL.vk;
    loadIdea(idea);
    el('pl').hidden=false;document.body.style.overflow='hidden';
    el('plStart').focus();
  }
  function closePlayer(){
    stopNarr();PL.open=false;PL.playing=false;
    if(PL.ctx){try{PL.ctx.suspend()}catch(e){}}
    el('pl').hidden=true;document.body.style.overflow='';
    if(PL.opener&&document.contains(PL.opener))PL.opener.focus();
  }
  function testSound(){
    initAudio();
    if(!PL.ctx){status('This browser has no audio engine.',true);return}
    PL.ctx.resume().then(function(){
      if(PL.ctx.state!=='running'){status('Audio is blocked in this view (state: '+PL.ctx.state+').',true);return}
      SFX.chime();
      status('Played a chime. If you heard nothing, check your volume and that this tab is not muted.');
      if(PL.idea&&!PL.playing){
        loadNarr(PL.idea.id+'-0').then(function(buf){
          if(!buf)return;
          try{var s=PL.ctx.createBufferSource();s.buffer=buf;s.connect(PL.vgain);s.start(PL.ctx.currentTime+.7);status('Played a chime, then the first line of the story.')}catch(e){}
        });
      }
    },function(){status('Audio could not start in this view.',true)});
  }
  function frame(ts){
    if(PL.open&&PL.playing&&!PL.loading){
      var dt=Math.min(100,ts-PL.last);PL.last=ts;PL.st+=dt/1000;
      while(PL.ptr<PL.evs.length&&PL.evs[PL.ptr].t<=PL.st){sfx(PL.evs[PL.ptr].n);PL.ptr++}
      PL.counts.forEach(function(c){
        var p=Math.max(0,Math.min(1,(PL.st-c.d)/c.dur)),e=1-Math.pow(1-p,3);
        c.n.textContent=c.pre+fmt(c.from+(c.to-c.from)*e)+c.suf;
      });
      var spoken=PL.speechDone||!PL.sound||PL.st>PL.min*2+4;
      if(PL.st>=PL.min&&spoken){
        if(PL.idx<PL.scenes.length-1)startScene(PL.idx+1);else finish();
      }
      if(PL.eng)PL.eng.render(PL.st);
      paintSegs();
    }else if(PL.playing){PL.last=ts}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  el('plVoice').innerHTML=VOICES.map(function(v){return '<option value="'+v.k+'">'+v.n+'</option>'}).join('');
  el('plVoice').value=PL.vk;
  el('plStart').addEventListener('click',begin);
  el('plReplay').addEventListener('click',begin);
  el('plNext').addEventListener('click',function(){var n=nextIdea();if(n){loadIdea(n);begin()}});
  el('plClose').addEventListener('click',closePlayer);
  el('plTest').addEventListener('click',testSound);
  el('plPlay').addEventListener('click',function(){
    if(!PL.started||!el('plEnd').hidden){begin();return}
    if(PL.playing){setPlaying(false);if(PL.mode==='browser')stopNarr()}
    else{setPlaying(true);if(PL.mode==='browser'&&!PL.speechDone&&PL.sc)speakBrowser(PL.sc.nar)}
  });
  el('plSegs').addEventListener('click',function(e){
    var b=e.target.closest('.pl-seg');if(!b)return;
    if(!PL.started){initAudio();PL.started=true;el('plCover').hidden=true;prefetch()}
    el('plEnd').hidden=true;
    setPlaying(true);startScene(+b.dataset.k);
  });
  el('plSound').addEventListener('change',function(e){
    PL.sound=e.target.checked;savePrefs();
    if(!PL.sound){stopNarr();PL.speechDone=true;status('Sound is off. Captions only.')}
    else{initAudio();if(PL.playing&&PL.sc)playNarr(PL.buf,PL.sc);else status('Sound is on.')}
  });
  el('plVoice').addEventListener('change',function(e){
    PL.vk=e.target.value;savePrefs();
    if(PL.started&&!el('plEnd').hidden===false){prefetch();if(PL.playing)startScene(PL.idx)}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&PL.open)closePlayer()});
  document.addEventListener('visibilitychange',function(){
    if(document.hidden&&PL.open&&PL.playing){setPlaying(false);if(PL.mode==='browser')stopNarr()}
  });

  show('today');
})();
</script>
